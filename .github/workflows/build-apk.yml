name: Bygg Tarno Dyklogg APK
'on': {push: {branches: [main]}, workflow_dispatch: {}}
jobs: {build: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {name: Packa upp appen, run: unzip -o Tarno_Dyklogg_Android_GitHub.zip}, {uses: actions/setup-java@v4, with: {distribution: temurin, java-version: '17'}}, {uses: gradle/actions/setup-gradle@v4, with: {gradle-version: '8.9'}}, {name: Bygg APK, run: gradle assembleDebug}, {uses: actions/upload-artifact@v4, with: {name: Tarno_Dyklogg_APK, path: app/build/outputs/apk/debug/app-debug.apk}}]}}
