name: Bygg och publicera Tarno Dyklogg
'on': {push: {branches: [main]}, workflow_dispatch: {}}
permissions: {contents: write}
jobs: {build: {runs-on: ubuntu-latest, timeout-minutes: 20, steps: [{uses: actions/checkout@v4}, {name: Packa upp projektet, run: unzip -o Tarno_Dyklogg_Android_GitHub.zip}, {uses: actions/setup-java@v4, with: {distribution: temurin, java-version: '17'}}, {uses: gradle/actions/setup-gradle@v4, with: {gradle-version: '8.9'}}, {name: Bygg APK, run: gradle assembleDebug}, {name: Kontrollera APK, run: test -s app/build/outputs/apk/debug/app-debug.apk && unzip -t app/build/outputs/apk/debug/app-debug.apk}, {name: Döp installationsfilen, run: cp app/build/outputs/apk/debug/app-debug.apk Tarno_Dyklogg.apk}, {name: Publicera Release, run: "if gh release view v1.0.0 >/dev/null 2>&1; then gh release upload v1.0.0 Tarno_Dyklogg.apk --clobber; else gh release create v1.0.0 Tarno_Dyklogg.apk --title 'Tarno Dyklogg 1.0.0' --notes 'Installerbar Android-app för Tärnö Dykeri.'; fi", env: {GH_TOKEN: '${{ github.token }}'}}, {uses: actions/upload-artifact@v4, with: {name: Tarno_Dyklogg_APK_backup, path: Tarno_Dyklogg.apk}}]}}
